<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Benjamin Rafa Gelato · Temporada 25-26 | AIHXO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #17234a 0%, #080b14 45%, #020306 100%);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .page {
      width: min(94%, 760px);
      margin: auto;
      padding: 35px 0 50px;
    }

    .aihxo {
      font-size: 15px;
      letter-spacing: 7px;
      color: #aaa8ff;
      margin-bottom: 25px;
    }

    .x {
      font-size: 55px;
      line-height: 45px;
      font-weight: bold;
      background: linear-gradient(135deg, #176cff, #9c4dff);
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 8px;
    }

    .season {
      text-transform: uppercase;
      letter-spacing: 5px;
      font-size: 13px;
      opacity: .75;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 52px);
      line-height: 1.05;
    }

    .year {
      margin: 15px 0 25px;
      font-size: 32px;
      font-weight: bold;
      background: linear-gradient(90deg, #2776ff, #a451ff);
      -webkit-background-clip: text;
      color: transparent;
    }

    .photo {
      width: 100%;
      display: block;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.15);
      box-shadow: 0 20px 60px rgba(0,0,0,.55);
    }

    .phrase {
      font-family: Georgia, serif;
      font-style: italic;
      font-size: clamp(25px, 6vw, 40px);
      margin: 32px 0 8px;
    }

    .heart {
      color: #9c55ff;
    }

    .memory {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 3px;
      opacity: .55;
      margin-top: 25px;
    }

    footer {
      margin-top: 45px;
      font-size: 11px;
      letter-spacing: 3px;
      opacity: .45;
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="x">X</div>
    <div class="aihxo">AIHXO</div>

    <div class="season">Temporada</div>

    <h1>BENJAMIN<br>RAFA GELATO</h1>

    <div class="year">25 — 26</div>

    <img
      class="photo"
      src="equipo.jpg"
      alt="Benjamin Rafa Gelato · Temporada 25-26"
    >

    <div class="phrase">
      Más que un equipo <span class="heart">♡</span>
    </div>

    <div class="memory">
      Nuestro recuerdo · Temporada 2025-2026
    </div>

    <footer>
      AIHXO · MEMORIES
    </footer>

  </main>

</body>
</html>
