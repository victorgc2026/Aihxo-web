<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AIHXO Dark Premium · Demo</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f1f5fa;background:#0a101b}*{box-sizing:border-box}body{margin:0;background:#0a101b}header{padding:20px;background:#111d2b;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #304056;position:sticky;top:0}header b{font-size:25px;letter-spacing:2px}header em{color:#d6ff45;font-style:normal}.tag{border:1px solid #d6ff45;color:#d6ff45;font-size:11px;padding:6px 8px;border-radius:20px}.wrap{max-width:1100px;margin:auto;padding:22px 16px 90px}h1{font-size:24px;margin:0 0 8px}.hint{color:#9cacc0;font-size:13px}.nav{display:flex;gap:8px;overflow:auto;margin:22px 0}.nav button,button{border:1px solid #354459;border-radius:12px;background:#1a2839;color:#edf3f9;padding:12px 15px;cursor:pointer;white-space:nowrap}.nav button.active,.primary{background:#d6ff45;color:#101722;border-color:#d6ff45;font-weight:800}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{border:1px solid #2b3c50;background:#152132;border-radius:19px;padding:18px;margin-bottom:12px}.metric{font-size:28px;font-weight:850;margin-top:12px}.muted{color:#a9bbce;font-size:13px}table{border-collapse:collapse;width:100%;min-width:530px}td,th{text-align:left;border-bottom:1px solid #304157;padding:12px}th{color:#9eb1c5;font-size:12px}.scroll{overflow:auto}input,select{padding:12px;border:1px solid #354a62;border-radius:12px;background:#0b1623;color:white;width:100%;margin:8px 0 16px}.pill{color:#d6ff45}.studio{border:2px dashed #364d63;border-radius:14px;text-align:center;padding:55px 5px;color:#9fb4cb}footer{position:fixed;bottom:0;background:#111d2b;border-top:1px solid #364358;width:100%;padding:10px;display:flex;justify-content:space-around}footer button{padding:10px 8px;font-size:12px} @media(min-width:760px){.cards{grid-template-columns:repeat(4,1fr)}footer{display:none}}</style></head><body><header><b>AIH<em>X</em>O</b><span class="tag">DEMO · SIN DATOS REALES</span></header><div class="wrap"><h1 id="title">Panel de control</h1><div class="hint">Borrador Dark Premium · navegación interactiva y datos ficticios</div><nav id="nav" class="nav"></nav><main id="content"></main></div><footer id="footer"></footer><script>
const tabs=[['inicio','Inicio','⌂'],['pedidos','Pedidos','▣'],['stock','Stock','▤'],['prendas','Prendas','◈'],['studio','Studio','✦']];let active='inicio';const orders=[['A-102','Ana','Camiseta Melbourne','Producción'],['A-103','Pablo','Tote bag arena','Pendiente'],['A-104','Carla','Camiseta infantil','Preparado']];const stock=[['Melbourne','Negro','XL',8],['Melbourne','Blanco','M',2],['Estoril','Azul','7/8',1],['Tote bag','Arena','Única',12]];function go(x){active=x;document.getElementById('title').textContent=tabs.find(t=>t[0]===x)[1];document.getElementById('nav').innerHTML=tabs.map(t=>'<button class="'+(t[0]===x?'active':'')+'" onclick="go(\''+t[0]+'\')">'+t[2]+' '+t[1]+'</button>').join('');document.getElementById('footer').innerHTML=tabs.map(t=>'<button class="'+(t[0]===x?'active':'')+'" onclick="go(\''+t[0]+'\')">'+t[2]+' '+t[1]+'</button>').join('');let h='';if(x==='inicio')h='<div class="cards">'+[['Ventas del mes','428,50 €'],['Pedidos activos','7'],['En producción','3'],['Stock bajo','2']].map(c=>'<div class="card"><span class="muted">'+c[0]+'</span><div class="metric">'+c[1]+'</div><span class="hint">Dato de ejemplo</span></div>').join('')+'</div><div class="card"><h3>Accesos rápidos</h3><button class="primary" onclick="go(\'pedidos\')">Ver pedidos →</button> <button onclick="go(\'stock\')">Consultar stock</button></div>';if(x==='pedidos')h='<div class="card"><input id="search" placeholder="Buscar pedido, cliente o prenda" oninput="rows()"><div class="scroll"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Prenda</th><th>Estado</th></tr></thead><tbody id="result"></tbody></table></div></div>';if(x==='stock')h='<div class="card"><h3>Existencias</h3><div class="scroll"><table><tr><th>Modelo</th><th>Color</th><th>Talla</th><th>Uds.</th></tr>'+stock.map(s=>'<tr>'+s.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</table></div></div>';if(x==='prendas')h='<div class="cards">'+['Melbourne','Estoril','Sudadera básica','Tote bag'].map(s=>'<div class="card"><div style="font-size:32px">👕</div><h3>'+s+'</h3><div class="hint">Ficha ilustrativa</div></div>').join('')+'</div>';if(x==='studio')h='<div class="card"><h3>Creative Studio</h3><label>Idea del diseño</label><input placeholder="Retranca galega vintage"><div class="studio">👕<p>Zona de vista previa</p><small>Solo maqueta visual; no genera imágenes</small></div></div>';document.getElementById('content').innerHTML=h;if(x==='pedidos')rows()}function rows(){let q=document.getElementById('search').value.toLowerCase();document.getElementById('result').innerHTML=orders.filter(o=>o.join(' ').toLowerCase().includes(q)).map(o=>'<tr>'+o.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')||'<tr><td colspan="4">Sin resultados</td></tr>'}go('inicio');
</script></body></html>
