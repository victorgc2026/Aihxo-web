<style>
:root{--neon:#dfff00;--bg:#050505;--card:#101010;--text:#f6f6f6;--muted:#a8a8a8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100svh;display:grid;place-items:center;padding:24px 16px;background:
radial-gradient(circle at 50% 25%,rgba(223,255,0,.11),transparent 32%),
linear-gradient(160deg,#030303,#0a0a0a 60%,#050505)}
.wrap{width:min(470px,100%);text-align:center}
.brand{font-weight:950;font-size:clamp(42px,13vw,70px);letter-spacing:-.06em;line-height:.95;margin:0 0 8px}
.brand .x{color:var(--neon)}
.tag{margin:0 0 24px;color:#d8d8d8;text-transform:uppercase;font-size:12px;letter-spacing:.38em}
.card{position:relative;background:linear-gradient(180deg,#141414,#0d0d0d);border:1px solid #262626;border-radius:28px;padding:22px;box-shadow:0 22px 70px rgba(0,0,0,.5)}
.card:before{content:"";position:absolute;inset:-1px;border-radius:28px;padding:1px;background:linear-gradient(145deg,rgba(223,255,0,.65),transparent 32%,transparent 68%,rgba(223,255,0,.22));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.kicker{margin:2px 0 15px;text-transform:uppercase;letter-spacing:.22em;font-size:12px;color:var(--muted)}
.qrbox{background:#fff;border-radius:22px;padding:14px;margin:auto;width:min(330px,88%);box-shadow:0 0 0 3px var(--neon),0 0 28px rgba(223,255,0,.18)}
.qrbox img{display:block;width:100%;height:auto;border-radius:8px}
h1{font-size:25px;margin:22px 0 7px}
.handle{color:var(--neon);font-size:19px;font-weight:800;margin-bottom:20px}
.actions{display:grid;gap:11px}
button,a.btn{appearance:none;border:0;border-radius:15px;min-height:54px;padding:0 18px;font-size:16px;font-weight:850;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}
.primary{background:var(--neon);color:#080808}
.secondary{background:#1c1c1c;color:#fff;border:1px solid #333}
.copy{background:transparent;color:#d5d5d5;border:1px solid #2b2b2b}
.note{font-size:12px;color:#787878;margin:18px 6px 4px;line-height:1.5}
.back{display:inline-block;margin-top:20px;color:#9a9a9a;text-decoration:none;font-size:13px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:#fff;color:#111;padding:10px 15px;border-radius:999px;font-weight:800;font-size:13px;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>

<script>
const instagramUrl='https://www.instagram.com/aihxo.camisetas/';
const shareBtn=document.getElementById('shareBtn');
const copyBtn=document.getElementById('copyBtn');
const toast=document.getElementById('toast');
function showToast(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1900)}
async function copyLink(){
  try{await navigator.clipboard.writeText(instagramUrl);showToast('Enlace copiado');}
  catch(e){window.prompt('Copia este enlace:',instagramUrl);}
}
shareBtn.addEventListener('click',async()=>{
  if(navigator.share){
    try{await navigator.share({title:'AIHXO en Instagram',text:'Síguenos en Instagram: @aihxo.camisetas',url:instagramUrl});}
    catch(e){if(e.name!=='AbortError') copyLink();}
  } else {copyLink();}
});
copyBtn.addEventListener('click',copyLink);
</script>
