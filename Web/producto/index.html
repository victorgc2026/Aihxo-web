<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07152f">
<title>Producto AIHXO</title>
<meta name="robots" content="index,follow,max-image-preview:large">
<link rel="stylesheet" href="../styles.css?v=392">
<style>
body{background:#f7f8fa;color:#07152f}
.pwrap{width:min(980px,calc(100% - 32px));margin:0 auto;padding:28px 0 60px}
.pback{display:inline-block;margin-bottom:22px;color:#07152f;font-weight:900;text-decoration:none}
.pcard{display:grid;grid-template-columns:1.05fr .95fr;gap:28px;background:#fff;border:1px solid #e2e7ee;border-radius:20px;padding:22px}
.pimg{width:100%;border-radius:14px;display:block;background:#f4f6f9}
.pkicker{font-size:11px;letter-spacing:1.4px;font-weight:900;color:#087cf4}
h1{font-size:clamp(32px,6vw,52px);line-height:1.02;margin:10px 0 12px}
.price{font-size:30px;font-weight:950;margin:10px 0 18px}
.meta{display:grid;gap:10px;margin:18px 0}.meta div{padding:10px 12px;background:#f7f8fa;border-radius:10px}
.desc{white-space:pre-line;color:#4d5a70}
.cta{display:block;text-align:center;margin-top:20px;background:#07152f;color:#DFFF00;padding:14px 16px;border-radius:12px;text-decoration:none;font-weight:950}
.notice{margin-top:12px;font-size:13px;color:#68758a}
@media(max-width:720px){.pcard{grid-template-columns:1fr}.pwrap{padding-top:18px}}
</style>
</head>
<body>
<main class="pwrap">
<a class="pback" href="../">← AIHXO</a>
<section class="pcard" id="product"><div>Cargando producto…</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient('https://zoiesxtchnesrilpuqek.supabase.co','sb_publishable_-DyRFQxtVvvwiPlvkZyUtA_upKb2W7T');
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
(async()=>{
 const qs=new URLSearchParams(location.search);
 const sku=qs.get('sku')||'';
 const size=qs.get('size')||'';
 const color=qs.get('color')||'';
 const root=document.getElementById('product');
 if(!sku){root.innerHTML='<div>Producto no encontrado.</div>';return;}
 const {data:p,error}=await sb.from('products').select('*').eq('sku',sku).maybeSingle();
 if(error||!p){root.innerHTML='<div>Producto no encontrado.</div>';return;}
 const name=p.model||p.sku||'Diseño AIHXO';
 const gallery=Array.isArray(p.gallery)?p.gallery.filter(Boolean):[];
 const image=p.homepage_image_url||gallery[0]||p.image_url||'';
 const price=Number(p.price_one_print||p.sale_price||0);
 const stock=Number(p.stock||0);
 const salesDisabled=Boolean(p.sales_disabled);
 const orderable=p.orderable_when_out_of_stock!==false;
 const availability=salesDisabled?'No disponible':(stock>0?'Stock inmediato':(orderable?'Disponible bajo pedido al proveedor':'No disponible'));
 document.title=name+' | AIHXO';
 const desc=p.features||'Diseño original AIHXO.';
 const wa='https://wa.me/34634344174?text='+encodeURIComponent(
   'Hola AIHXO, quiero este producto:\n\n'+
   'Diseño: '+name+
   (size?'\nTalla: '+size:'')+
   (color?'\nColor: '+color:'')+
   '\nPrecio: '+price.toLocaleString('es-ES',{style:'currency',currency:'EUR'})
 );
 root.innerHTML=`
   <div><img class="pimg" src="${esc(image)}" alt="${esc(name)}"></div>
   <div>
     <div class="pkicker">DISEÑO AIHXO</div>
     <h1>${esc(name)}</h1>
     <div class="price">${price.toLocaleString('es-ES',{style:'currency',currency:'EUR'})}</div>
     <div class="meta">
       ${size?'<div><strong>Talla:</strong> '+esc(size)+'</div>':''}
       ${color?'<div><strong>Color:</strong> '+esc(color)+'</div>':''}
       <div><strong>Estado:</strong> ${esc(availability)}</div>
       <div><strong>Envío:</strong> 5,00 €</div>
     </div>
     <div class="desc">${esc(desc)}</div>
     ${salesDisabled||(!orderable&&stock<=0)?'<div class="cta" style="opacity:.55;pointer-events:none">NO DISPONIBLE</div>':'<a class="cta" href="'+wa+'" target="_blank" rel="noopener">PEDIR POR WHATSAPP →</a>'}
     <div class="notice">${stock>0?'Disponible para preparación con stock actual.':(orderable&&!salesDisabled?'Esta prenda se solicita al proveedor al recibir el pedido; la preparación comienza cuando AIHXO la recibe.':'Producto no disponible actualmente.')} ${stock>0?'Preparación habitual: 1–2 días laborables.':''} Transporte estimado tras preparación: 1–3 días laborables.</div>
   </div>`;
})();
</script>
</body>
</html>
