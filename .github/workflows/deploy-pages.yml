name: Deploy AIHXO Web to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "Web/**"
      - "gestion/**"
      - "agenda/**"
      - "demo-dtf-tallas/**"
      - "halloween/**"
      - "recuerdos/**"
      - "privacidad.html"
      - "condiciones.html"
      - "eliminacion-datos.html"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -a Web/. _site/
          mkdir -p _site/halloween
          cp -a halloween/. _site/halloween/
          mkdir -p _site/gestion
          cp -a gestion/. _site/gestion/
          mkdir -p _site/agenda
          cp -a agenda/. _site/agenda/
          mkdir -p _site/demo-dtf-tallas
          cp -a demo-dtf-tallas/. _site/demo-dtf-tallas/
          mkdir -p _site/recuerdos
          
          if [ -d recuerdos ]; then cp -a recuerdos/. _site/recuerdos/; fi
          cp privacidad.html _site/privacidad.html
          cp condiciones.html _site/condiciones.html
          cp eliminacion-datos.html _site/eliminacion-datos.html
          test -s _site/index.html
          test -s _site/catalogo/index.html
          grep -q 'catalogo/' _site/index.html
          echo "Catalogo incluido en el artefacto de publicacion"
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Wait for Pages artifact availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            echo "Pages artifact check ${attempt}: ${COUNT}"
            if [ "${COUNT}" -ge 1 ]; then
              echo "Pages artifact detected by API"
              exit 0
            fi
            sleep 10
          done
          echo "Pages artifact not yet visible to API" >&2
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
