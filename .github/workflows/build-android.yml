name: Build AIHXO Gestion APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: android-app
        run: gradle assembleDebug

      - name: Preparar AIHXO-Gestion.apk
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk AIHXO-Gestion.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AIHXO-Gestion-APK
          path: AIHXO-Gestion.apk
