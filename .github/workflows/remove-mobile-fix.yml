name: Remove AIHXO Mobile Fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Quitar script móvil temporal
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Web/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('\n<script src="aihxo-mobile-fix.js?v=1"></script>','')
          s=s.replace('<script src="aihxo-mobile-fix.js?v=1"></script>\n','')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Guardar cambio
        run: |
          if git diff --quiet -- Web/index.html; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Web/index.html
          git commit -m "Retirar parche móvil temporal de Personaliza"
          git push origin HEAD:main
