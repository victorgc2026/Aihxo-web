name: Patch AIHXO Mobile Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insertar fix móvil
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Web/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="aihxo-mobile-fix.js?v=1"></script>'
          if tag not in s:
              s=s.replace('</body>', f'{tag}\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Guardar cambio
        run: |
          if git diff --quiet -- Web/index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Web/index.html
          git commit -m "Cargar corrección móvil del catálogo"
          git push
