<script>
const url='https://zoiesxtchnesrilpuqek.supabase.co',key='sb_publishable_-DyRFQxtVvvwiPlvkZyUtA_upKb2W7T';
window.supabaseClient=supabase.createClient(url,key);
const $=x=>document.querySelector(x),msg=t=>$('#message').textContent=t;
async function refresh(){const {data:{session},error}=await supabaseClient.auth.getSession();if(error)msg('No se pudo comprobar la sesión.');const allowed=session?.user?.email?.toLowerCase()==='aihxo.camisetas@gmail.com';$('#signin').hidden=!!allowed;$('#ready').hidden=!allowed;if(session&&!allowed)msg('Esta cuenta no tiene acceso de administrador.');}

</script><script>
/* AIHXO · Selector seguro de modelos y escenarios · no modifica los flujos existentes */
(function(){
 'use strict';
 if(window.__aihxoModelosEscenarios)return;
 window.__aihxoModelosEscenarios=true;
 const $=(s,r=document)=>r.querySelector(s);
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const sceneTags={
  estudio:['estudio','studio','blanco','gris','fondo neutro'],
  urbano:['urbano','urban','calle','city'],
  costa:['playa','costa','mar','beach'],
  lifestyle:['lifestyle','interior','cafe','casual'],
  deporte:['deporte','sport','fitness','gym']
 };
 let garmentList=[],photos=[],used=new Set(),chosen=null;
 const state={garment:'',gender:'todos',scene:'todos',side:'front'};
 function scenario(p){
  const raw=(p.name+' '+(p.scenario||'')).toLowerCase();
  return Object.keys(sceneTags).find(k=>sceneTags[k].some(term=>raw.includes(term)))||'sin-etiqueta';
 }
 function sameGarment(p){return String(p.garment_id)===String(state.garment)}
 function genderFits(p){return state.gender==='todos'||p.gender===state.gender||p.gender==='unisex'}
 function sceneFits(p){return state.scene==='todos'||scenario(p)===state.scene}
 function candidates(){return photos.filter(p=>p.active!==false&&sameGarment(p)&&genderFits(p)&&sceneFits(p)&&p.side===state.side&&p.image_url)}
 async function load(){
  const api=window.supabaseClient;if(!api)throw Error('Inicia sesión en AIHXO Gestión');
  const [gr,pr]=await Promise.all([
   api.from('garments').select('id,manufacturer,model,audience,active').eq('active',true).order('manufacturer').order('model'),
   api.from('mockup_templates').select('id,name,garment_id,gender,side,image_url,active').eq('active',true).order('name')
  ]);
  if(gr.error||pr.error)throw(gr.error||pr.error);
  garmentList=gr.data||[];photos=pr.data||[];
  if(!garmentList.some(g=>String(g.id)===String(state.garment)))state.garment=String(garmentList[0]?.id||'');
 }
 function modal(){
  $('#aihxoModelScenePanel')?.remove();
  const el=document.createElement('div');el.id='aihxoModelScenePanel';
  el.style.cssText='position:fixed;inset:0;z-index:15000;background:#07152fd9;overflow:auto;padding:12px;box-sizing:border-box';
  el.innerHTML=`<div style="max-width:940px;margin:auto;background:#fff;color:#17233b;border-radius:18px;padding:16px">
  <header style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div><h2 style="margin:0">👤 Modelos y escenarios</h2><p style="color:#5b6472;margin:4px 0">Fotografías reales del banco AIHXO, compatibles con la prenda seleccionada.</p></div><button type="button" id="msClose" class="secondary">✕</button></header>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin:14px 0">
  <label>Prenda base<select id="msGarment" style="width:100%"></select></label>
  <label>Modelo<select id="msGender" style="width:100%"><option value="todos">Todos</option><option value="hombre">Hombre</option><option value="mujer">Mujer</option><option value="unisex">Unisex</option></select></label>
  <label>Escenario<select id="msScene" style="width:100%"><option value="todos">Todos</option><option value="estudio">Estudio</option><option value="urbano">Urbano</option><option value="costa">Costa / playa</option><option value="lifestyle">Lifestyle</option><option value="deporte">Deporte</option><option value="sin-etiqueta">Sin clasificar</option></select></label>
  <label>Vista<select id="msSide" style="width:100%"><option value="front">Delantera</option><option value="back">Trasera</option></select></label></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary" type="button" id="msRandom">🎲 Modelo aleatorio</button><button class="secondary" type="button" id="msRandomScene">🎲 Escenario aleatorio</button><button class="secondary" type="button" id="msRefresh">↻ Actualizar biblioteca</button><button class="secondary" type="button" id="msUpload">＋ Añadir fotografía</button></div>
  <p id="msStatus" role="status" style="color:#526079;margin:12px 0"></p>
  <div id="msList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px"></div>
  <div id="msChoice" style="margin-top:14px"></div>
  <p style="font-size:12px;color:#667085;margin-top:14px">Las fotografías del banco mantienen su prenda y fondo originales. Cambiar un escenario o la prenda de una fotografía requiere generar o editar una imagen nueva; esta herramienta no simula esa sustitución.</p></div>`;
  document.body.appendChild(el);
  $('#msClose',el).onclick=()=>el.remove();
  $('#msGarment',el).innerHTML=garmentList.map(g=>`<option value="${esc(g.id)}">${esc(g.manufacturer)} · ${esc(g.model)}</option>`).join('');
  for(const [id,key] of [['msGarment','garment'],['msGender','gender'],['msScene','scene'],['msSide','side']]){
   $( '#'+id,el).value=state[key];
   $('#'+id,el).onchange=e=>{state[key]=e.target.value;chosen=null;used.clear();renderResults();};
  }
  $('#msRandom',el).onclick=()=>randomChoose();
  $('#msRandomScene',el).onclick=()=>{
   const values=['estudio','urbano','costa','lifestyle','deporte','sin-etiqueta'].filter(s=>photos.some(p=>sameGarment(p)&&genderFits(p)&&p.side===state.side&&scenario(p)===s));
   if(!values.length){setStatus('No hay escenarios distintos disponibles para esta prenda y vista.');return}
   const next=values[Math.floor(Math.random()*values.length)];state.scene=next;$('#msScene',el).value=next;used.clear();chosen=null;renderResults();randomChoose();
  };
  $('#msRefresh',el).onclick=async()=>{try{await load();$('#msGarment',el).innerHTML=garmentList.map(g=>`<option value="${esc(g.id)}">${esc(g.manufacturer)} · ${esc(g.model)}</option>`).join('');$('#msGarment',el).value=state.garment;renderResults()}catch(e){setStatus('Error de actualización: '+e.message)}};
  $('#msUpload',el).onclick=()=>{if(typeof window.aihxoNuevoMockup==='function'){el.remove();window.aihxoNuevoMockup()}else setStatus('Abre Banco mockups para añadir fotografías.')};
  renderResults();
 }
 function setStatus(message){const el=$('#msStatus');if(el)el.textContent=message;}
 function renderResults(){
  const list=$('#msList');if(!list)return;
  const options=candidates();
  setStatus(options.length?`${options.length} fotografía(s) disponibles. No se repite una persona hasta agotar las opciones de este filtro.`:'No hay fotografías de esa prenda, vista y filtros. Añade una foto desde Banco mockups.');
  list.innerHTML=options.map(p=>`<button type="button" data-id="${esc(p.id)}" style="background:#f5f7fa;border:2px solid ${chosen?.id===p.id?'#087cf4':'#e4e8ee'};padding:7px;border-radius:13px;text-align:left;color:#18263a"><img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy" style="width:100%;height:175px;object-fit:cover;border-radius:9px"><b style="display:block;font-size:13px">${esc(p.name)}</b><small>${esc(p.gender||'Sin tipo')} · ${esc(scenario(p))}</small></button>`).join('');
  list.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>select(options.find(p=>String(p.id)===b.dataset.id)));
  if(chosen)showChoice();
  else $('#msChoice').innerHTML='';
 }
 function personKey(p){return String(p.name).replace(/\s*[·-]\s*(delantera|trasera|front|back)\s*$/i,'').trim().toLowerCase();}
 function randomChoose(){
  const pool=candidates();if(!pool.length){setStatus('No hay fotos para elegir con los filtros actuales.');return}
  let fresh=pool.filter(p=>!used.has(personKey(p)));
  if(!fresh.length){used.clear();fresh=pool;}
  select(fresh[Math.floor(Math.random()*fresh.length)]);
 }
 function select(p){if(!p)return;chosen=p;used.add(personKey(p));renderResults();}
 function showChoice(){
  const dest=$('#msChoice');if(!dest||!chosen)return;
  dest.innerHTML=`<div style="padding:12px;border:1px solid #dbe5f0;border-radius:12px"><b>Seleccionado:</b> ${esc(chosen.name)}<div style="margin-top:8px"><button id="msUse" type="button" class="primary">Usar fotografía en generador</button> <button id="msAgain" type="button" class="secondary">Otro modelo</button></div></div>`;
  $('#msAgain',dest).onclick=randomChoose;
  $('#msUse',dest).onclick=()=>{
   const current=chosen;$('#aihxoModelScenePanel')?.remove();
   if(typeof window.abrirGeneradorMockupConPlantilla==='function')window.abrirGeneradorMockupConPlantilla(current);
   else {window._aihxoPendingMockupTemplate=current;window.alert('Fotografía seleccionada. Abre un diseño AIHXO y el generador de mockups para utilizarla.');}
  };
 }
 window.abrirAIHXOModelosEscenarios=async function(){
  try{await load();modal()}catch(e){window.alert('No se pudo abrir Modelos y escenarios: '+e.message)}
 };
 function attach(){
  const nav=$('#nav');if(!nav||$('#aihxoModelSceneNav',nav))return;
  const btn=document.createElement('button');btn.id='aihxoModelSceneNav';btn.type='button';btn.innerHTML='🎲 <span>Modelos y escenarios</span>';btn.onclick=()=>window.abrirAIHXOModelosEscenarios();
  const target=$('#aihxoCreativeNav',nav)||$('#aihxoStudioNav',nav);
  if(target)target.insertAdjacentElement('afterend',btn);else nav.appendChild(btn);
 }
 const observer=new MutationObserver(()=>{if($('#nav')&&!$('#aihxoModelSceneNav'))attach()});
 observer.observe(document.documentElement,{childList:true,subtree:true});attach();
})();

</script>
<script>
(function(){
const $=s=>document.querySelector(s);
let design=null,generated=null;
const box=document.createElement('section');
box.id='newMockupMode';
box.innerHTML='<hr><h2>✨ Crear mockup desde cero (beta)</h2><p class="muted">Genera una fotografía conceptual con IA y superpone tu PNG. Comprueba colocación, prenda y diseño antes de publicarla.</p><label>Prenda base<select id="nmGarment"></select></label><label>Color de prenda<input id="nmColor" type="text" value="negro" placeholder="Color de fabricante"></label><label>Modelo<select id="nmGender"><option value="hombre">Hombre adulto</option><option value="mujer">Mujer adulta</option></select></label><label>Escenario<select id="nmScene"><option value="studio">Estudio</option><option value="urbano">Urbano</option><option value="playa">Costa / playa</option><option value="minimal">Estudio premium</option></select></label><label>Vista<select id="nmSide"><option value="front">Delantera</option><option value="back">Trasera</option></select></label><label>Diseño PNG transparente<input id="nmDesign" type="file" accept="image/png"></label><button id="nmGenerate" class="primary" type="button">✨ Generar modelo y escenario</button><p id="nmStatus" role="status" class="muted"></p><canvas id="nmCanvas" width="768" height="1024" style="width:100%;max-width:500px;display:none;border-radius:12px"></canvas><div id="nmAdjust" hidden><label>Tamaño del diseño<input id="nmSize" type="range" min="5" max="65" value="24"></label><label>Horizontal<input id="nmX" type="range" min="15" max="85" value="50"></label><label>Vertical<input id="nmY" type="range" min="15" max="85" value="43"></label><button id="nmDownload" class="primary" type="button">Descargar mockup PNG</button></div>';
$('#ready').appendChild(box);
const status=s=>$('#nmStatus').textContent=s;
async function loadGarments(){const {data,error}=await supabaseClient.from('garments').select('id,manufacturer,model,colors').eq('active',true).order('manufacturer');if(error){status('No se pudieron cargar prendas: '+error.message);return;}$('#nmGarment').innerHTML=(data||[]).map(g=>'<option value="'+g.id+'">'+String(g.manufacturer||'')+' · '+String(g.model||'')+'</option>').join('');}
function redraw(){if(!generated)return;const c=$('#nmCanvas'),x=c.getContext('2d');x.clearRect(0,0,768,1024);x.drawImage(generated,0,0,768,1024);if(design){const w=768*Number($('#nmSize').value)/100,h=w*design.height/design.width,px=768*Number($('#nmX').value)/100,py=1024*Number($('#nmY').value)/100;x.drawImage(design,px-w/2,py-h/2,w,h)}}
$('#nmDesign').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;if(f.type!=='image/png'||f.size>12e6){status('Sube PNG de menos de 12 MB.');return;}const u=URL.createObjectURL(f);const img=new Image();img.onload=()=>{design=img;URL.revokeObjectURL(u);redraw();status('Diseño listo para superponer.')};img.onerror=()=>{URL.revokeObjectURL(u);status('No se pudo leer el PNG.')};img.src=u;};
['nmSize','nmX','nmY'].forEach(id=>$('#'+id).oninput=redraw);
$('#nmGenerate').onclick=async()=>{
const btn=$('#nmGenerate');btn.disabled=true;status('Solicitando fotografía al generador de IA…');
try{
const g=$('#nmGarment').selectedOptions[0]?.textContent||'camiseta lisa';
const scene=$('#nmScene').value,side=$('#nmSide').value;
const idea='Fotografía comercial hiperrealista y natural de un modelo '+$('#nmGender').selectedOptions[0].textContent+', diferente y no famoso, vistiendo '+g+' de color '+$('#nmColor').value+'. Mostrar '+(side==='front'?'el frente':'la espalda')+' de la prenda lisa y SIN logos, SIN ilustraciones, SIN texto; camiseta bien visible, centrada, sin pliegues excesivos, iluminación profesional. Escenario '+scene+'. Fotografía de ropa para ecommerce.';
const {data,error}=await supabaseClient.functions.invoke('creative-image',{body:{mode:'mockup',idea,scene}});
if(error)throw error;if(!data?.image)throw Error(data?.error||'El proveedor no devolvió fotografía.');
const img=new Image();img.crossOrigin='anonymous';await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=data.image});generated=img;$('#nmCanvas').style.display='block';$('#nmAdjust').hidden=false;redraw();status('Imagen conceptual generada. Ajusta el PNG sobre la prenda. La superposición es aproximada: revisa antes de publicar.');
}catch(e){let detail='';try{if(e?.context&&typeof e.context.json==='function'){const body=await e.context.json();detail=body?.error||'';if(body?.provider_status===429)detail='Google Gemini ha alcanzado su cuota (error 429). Hay que revisar los límites o configurar otro proveedor de imágenes.';}}catch(_){}status('No se pudo generar la imagen: '+(detail||e?.message||'Error desconocido')+'.');}finally{btn.disabled=false;}
};
$('#nmDownload').onclick=()=>{if(!generated)return;try{$('#nmCanvas').toBlob(b=>{if(!b){status('No se pudo exportar.');return;}const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='aihxo-mockup-conceptual.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),4000)},'image/png')}catch(e){status('No se pudo exportar la imagen.')}};
supabaseClient.auth.onAuthStateChange((_event,session)=>{if(session)loadGarments()});supabaseClient.auth.getSession().then(({data})=>{if(data?.session)loadGarments()});
})();
</script>
<script>
(function(){
const $=q=>document.querySelector(q);
let base=null,art=null,items=[];
const area=document.createElement('section');area.id='freeMockups';
area.innerHTML='<hr><h2>🆓 Mockup sin créditos ni pagos</h2><p class="muted">Elige una fotografía que ya tengas autorizada o una del Banco AIHXO. Coloca tu diseño PNG sobre ella y descarga la composición. Todo se procesa en tu navegador, sin IA.</p><label>Plantilla del banco<select id="freeBank"><option value="">Seleccionar fotografía guardada...</option></select></label><button type="button" id="freeLoad" class="secondary">Cargar banco AIHXO</button><label>O subir fotografía con permiso comercial<input id="freePhoto" type="file" accept="image/png,image/jpeg,image/webp"></label><label>Diseño PNG transparente<input id="freeArt" type="file" accept="image/png"></label><label>Ancho diseño (%)<input type="range" id="freeSize" min="5" max="75" value="30"></label><label>Horizontal (%)<input type="range" id="freeX" min="5" max="95" value="50"></label><label>Vertical (%)<input type="range" id="freeY" min="5" max="95" value="45"></label><canvas id="freeCanvas" width="900" height="1100" style="display:block;width:100%;max-width:500px;border-radius:12px;background:#e9edf3"></canvas><p id="freeStatus" class="muted" role="status">Sube una imagen o elige una del banco.</p><button type="button" id="freeSave" class="primary">Descargar PNG sin coste</button><p class="muted" style="font-size:12px">Resultado conceptual 2D. No recolorea la prenda, no ajusta automáticamente pliegues ni sustituye a una plantilla PSD con máscara. Para publicitar AIHXO, utiliza solo fotografías con licencia y permisos de imagen apropiados.</p>';
$('#ready').append(area);
const status=t=>$('#freeStatus').textContent=t;
function render(){
 const c=$('#freeCanvas'),ctx=c.getContext('2d');ctx.fillStyle='#e9edf3';ctx.fillRect(0,0,c.width,c.height);
 if(!base){ctx.fillStyle='#65758a';ctx.font='22px system-ui';ctx.textAlign='center';ctx.fillText('Selecciona una fotografía',450,550);return;}
 const ratio=Math.max(c.width/base.width,c.height/base.height),dw=base.width*ratio,dh=base.height*ratio;
 ctx.drawImage(base,(c.width-dw)/2,(c.height-dh)/2,dw,dh);
 if(art){const w=c.width*Number($('#freeSize').value)/100,h=w*art.height/art.width,x=c.width*Number($('#freeX').value)/100,y=c.height*Number($('#freeY').value)/100;ctx.drawImage(art,x-w/2,y-h/2,w,h);}
}
function readFile(file,cb){if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>15e6){status('Formato no válido o más de 15 MB.');return;}const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);cb(im);render()};im.onerror=()=>{URL.revokeObjectURL(u);status('No se pudo abrir la imagen.')};im.src=u;}
$('#freePhoto').onchange=e=>readFile(e.target.files[0],im=>{base=im;status('Fotografía cargada. Ahora ajusta el diseño PNG.');});
$('#freeArt').onchange=e=>{const f=e.target.files[0];if(f&&f.type!=='image/png'){status('El diseño debe ser PNG.');return;}readFile(f,im=>{art=im;status('Diseño cargado. Puedes ajustar tamaño y posición.');});};
['freeSize','freeX','freeY'].forEach(k=>$('#'+k).oninput=render);
$('#freeLoad').onclick=async()=>{
 status('Cargando fotografías autorizadas del banco...');
 const {data,error}=await supabaseClient.from('mockup_templates').select('id,name,image_url,gender,side').eq('active',true).order('name');
 if(error){status('No se pudo leer el banco: '+error.message);return;}
 items=(data||[]).filter(x=>x.image_url);const sel=$('#freeBank');sel.innerHTML='<option value="">Seleccionar fotografía guardada...</option>';
 items.forEach((p,i)=>{const op=document.createElement('option');op.value=String(i);op.textContent=p.name+' · '+(p.gender||'')+' · '+(p.side==='back'?'Trasera':'Delantera');sel.append(op)});
 status(items.length+' fotografía(s) disponibles. Utiliza solo las que tengan derechos de uso confirmados.');
};
$('#freeBank').onchange=()=>{
 const p=items[Number($('#freeBank').value)];if(!p)return;
 const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{base=im;render();status('Modelo cargado del banco. Añade tu diseño.');};im.onerror=()=>status('La fotografía no permite composición directa. Descárgala y súbela desde tu dispositivo.');im.src=p.image_url;
};
$('#freeSave').onclick=()=>{if(!base){status('Primero selecciona una foto.');return;}try{$('#freeCanvas').toBlob(blob=>{if(!blob){status('No se pudo crear PNG.');return;}const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='AIHXO-mockup-gratis.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),4000)},'image/png')}catch(e){status('No se puede exportar esta foto desde el navegador. Prueba subiéndola desde Archivos.')}};
render();
})();
</script></body></html>
